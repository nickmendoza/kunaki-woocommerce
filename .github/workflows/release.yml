name: Release

on:
  push:
    tags: [ '*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build release ZIP
        run: git archive --format=zip --prefix=kunaki-woocommerce/ ${{ github.ref_name }} -o kunaki-woocommerce-${{ github.ref_name }}.zip

      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} kunaki-woocommerce-${{ github.ref_name }}.zip --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
